services:
  - type: web
    name: it-solutions-digital-card
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: it-solutions-digital-card-db
          property: connectionString

databases:
  - name: it-solutions-digital-card-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: profile
    user: profile
    ipAllowList: []
